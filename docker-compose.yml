services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: elastico
      POSTGRES_USER: elastico
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - elastico-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elastico -d elastico"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  elastico:
    build: .
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://elastico:${POSTGRES_PASSWORD}@postgres:5432/elastico?schema=public
      DIRECT_URL: postgresql://elastico:${POSTGRES_PASSWORD}@postgres:5432/elastico?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (at least 32 characters) in .env}
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET (at least 32 characters) in .env}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      GITHUB_MODELS_API_KEY: ${GITHUB_MODELS_API_KEY:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN to a DNS name pointing at this server}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - elastico
    restart: unless-stopped

volumes:
  elastico-postgres-data:
  caddy-data:
  caddy-config:
