services:
  elastico:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set to a PostgreSQL connection string}
      - DIRECT_URL=${DIRECT_URL:-${DATABASE_URL:?DATABASE_URL must be set}}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set to a random string of at least 32 characters}
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - elastico
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
