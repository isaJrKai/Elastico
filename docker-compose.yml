services:
  elastico:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/data/elastico.db
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
    volumes:
      - elastico-data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - elastico
    restart: unless-stopped

volumes:
  elastico-data:
  caddy-data:
  caddy-config: