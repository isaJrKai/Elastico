name: Dependency audit remediation

"on":
  push:
    branches:
      - "fix/prediction-engine-production-audit"
    paths:
      - ".github/workflows/dependency-audit-remediation.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: elastico-dependency-remediation
  cancel-in-progress: false

jobs:
  safe-remediation:
    name: Apply non-breaking dependency fixes and verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/elastico_ci?schema=public
      DIRECT_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/elastico_ci?schema=public
      JWT_SECRET: ci-only-not-for-production-0123456789abcdef
      NEXT_PUBLIC_BASE_URL: http://127.0.0.1:3000
      NODE_ENV: production

    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: fix/prediction-engine-production-audit

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies including development tools
        run: npm install --legacy-peer-deps --include=dev

      - name: Apply npm's non-forcing security fixes
        # Deliberately do not use --force: major-version changes require manual compatibility review.
        run: npm audit fix --legacy-peer-deps

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run prediction-engine invariants
        run: npm run test:prediction-engine

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint maintained application source
        run: npx eslint src --rule 'react-hooks/set-state-in-effect: off'

      - name: Build standalone production bundle
        run: npm run build

      - name: Verify standalone bundle
        run: |
          test -f .next/standalone/server.js
          test -d .next/standalone/.next/static
          test -d .next/standalone/public

      - name: Commit dependency lockfile changes after tests pass
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "fix(security): apply non-breaking dependency updates"
            git push origin HEAD:fix/prediction-engine-production-audit
          else
            echo "No dependency manifest or lockfile changes were needed."
          fi

      - name: Enforce production dependency security gate
        run: npm audit --omit=dev --audit-level=high
