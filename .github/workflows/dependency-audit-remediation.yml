name: Dependency audit remediation

on:
  push:
    branches:
      - "fix/**"
    paths:
      - ".github/workflows/dependency-audit-remediation.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  safe-remediation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/elastico_ci?schema=public
      DIRECT_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/elastico_ci?schema=public
      JWT_SECRET: ci-only-not-for-production-0123456789abcdef
      NEXT_PUBLIC_BASE_URL: http://127.0.0.1:3000
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prediction-engine-production-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --legacy-peer-deps --include=dev
      - name: Apply non-breaking npm security fixes
        run: npm audit fix --legacy-peer-deps
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Test prediction engine
        run: npm run test:prediction-engine
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint application source
        run: npx eslint src --rule 'react-hooks/set-state-in-effect: off'
      - name: Build production bundle
        run: npm run build
      - name: Verify standalone bundle
        run: |
          test -f .next/standalone/server.js
          test -d .next/standalone/.next/static
          test -d .next/standalone/public
      - name: Commit safe dependency updates
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "fix(security): apply compatible dependency updates"
            git push origin HEAD:fix/prediction-engine-production-audit
          else
            echo "No dependency manifest or lockfile changes."
          fi
      - name: Enforce production dependency audit
        run: npm audit --omit=dev --audit-level=high
