name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/elastico?schema=public
      JWT_SECRET: ci-only-secret-that-is-at-least-thirty-two-characters-long
      CRON_SECRET: ci-only-cron-secret-that-is-at-least-thirty-two-characters
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Scan tracked working tree for committed credential patterns
        shell: bash
        run: |
          if git grep -nE 'npg_[A-Za-z0-9_-]+|postgresql://[^:[:space:]]+:[^@[:space:]]+@' -- . ':!.env.example'; then
            echo "Potential hard-coded database credential detected in tracked files."
            exit 1
          fi
          echo "No known hard-coded database credential patterns found in the working tree."
      - name: Reconcile npm lockfile for diagnostic run
        run: npm install --package-lock-only --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Upload reconciled lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: elastico-reconciled-package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Start production server
        run: |
          (NODE_ENV=production node .next/standalone/server.js > /tmp/elastico-server.log 2>&1 & echo $! > /tmp/elastico-server.pid)
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ -o /dev/null; then
              echo "Production server is serving the home page"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/elastico-server.log
          exit 1
      - name: Production smoke tests
        run: node scripts/smoke-test.mjs
      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/elastico-server.pid ]; then
            kill "$(cat /tmp/elastico-server.pid)" || true
          fi
