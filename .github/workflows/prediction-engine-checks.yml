name: Prediction Engine Checks

on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/prediction-engine.ts"
      - "src/lib/prediction-engine.test.ts"
      - "src/app/api/prediction-engine/**"
      - "src/app/api/predictions/compute/**"
      - "src/components/elastico/prediction-engine-view.tsx"
      - "src/components/elastico/predictions-view.tsx"
      - "scripts/train_openfootball_baseline.py"
      - "scripts/train_openfootball_poisson.py"
      - "scripts/benchmark_openfootball_market.py"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/prediction-engine-checks.yml"

permissions:
  contents: read

jobs:
  prediction-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Test prediction engine invariants
        run: npm run test:prediction-engine

      - name: Install model-training dependencies
        run: python -m pip install --upgrade pip numpy scipy

      - name: Train and evaluate OpenFootball Elo baseline
        run: python scripts/train_openfootball_baseline.py

      - name: Train and evaluate regularized Poisson model
        run: python scripts/train_openfootball_poisson.py

      - name: Compare holdout predictions with licensed fair-market probabilities
        run: python scripts/benchmark_openfootball_market.py

      - name: Upload baseline metrics and holdout predictions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openfootball-elo-baseline
          path: |
            artifacts/openfootball-elo/*.json
            artifacts/openfootball-poisson/*.json
            artifacts/openfootball-market-comparison/*.json
          if-no-files-found: warn

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint changed prediction surfaces
        run: npx eslint src/lib/prediction-engine.ts src/lib/prediction-engine.test.ts src/app/api/prediction-engine/simulate/route.ts src/app/api/prediction-engine/kelly/route.ts src/app/api/predictions/compute/route.ts src/components/elastico/prediction-engine-view.tsx src/components/elastico/predictions-view.tsx
