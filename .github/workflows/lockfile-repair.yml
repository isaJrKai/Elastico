name: Regenerate npm lockfile (temporary)

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/lockfile-repair.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile without running package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate clean install consistency
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Upload verified lockfile
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3
