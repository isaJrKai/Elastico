name: Train football prediction model

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: "Exclusive UTC date cutoff (YYYY-MM-DD)"
        required: true
        default: "2026-10-24"
      holdout_days:
        description: "Chronological held-out window in days"
        required: true
        default: "730"

permissions:
  contents: read

concurrency:
  group: football-model-training
  cancel-in-progress: false

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: integration/release-candidate-03
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install training dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r ml/requirements.txt
      - name: Train and evaluate chronologically
        run: python ml/train_match_model.py --as-of "${{ inputs.as_of }}" --holdout-days "${{ inputs.holdout_days }}" --out artifacts/football-1x2
      - name: Upload model and evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: elastico-football-model-candidate
          path: |
            artifacts/football-1x2/model.json
            artifacts/football-1x2/evaluation.json
          if-no-files-found: error
          retention-days: 14
