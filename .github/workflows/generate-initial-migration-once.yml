name: One-time initial migration generation

on:
  push:
    branches: [production-readiness/hardening]
    paths:
      - ".github/workflows/generate-initial-migration-once.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://elastico:ci-password@localhost:5432/elastico?schema=public
      DIRECT_URL: postgresql://elastico:ci-password@localhost:5432/elastico?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-readiness/hardening
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - name: Generate the initial PostgreSQL migration from the checked-in schema
        run: |
          mkdir -p prisma/migrations/20261023000000_initial
          npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > prisma/migrations/20261023000000_initial/migration.sql
          test -s prisma/migrations/20261023000000_initial/migration.sql
          grep -q 'CREATE TABLE "User"' prisma/migrations/20261023000000_initial/migration.sql
          printf '# Please do not edit this file manually.\n# It should be committed to source control.\nprovider = "postgresql"\n' > prisma/migrations/migration_lock.toml
      - name: Commit migration and remove this temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/generate-initial-migration-once.yml
          git add prisma/migrations
          git commit -m "db: add initial PostgreSQL migration from Prisma schema"
          git push origin HEAD:production-readiness/hardening
